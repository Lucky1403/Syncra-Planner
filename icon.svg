<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#080b12" />
    </radialGradient>
    
    <!-- Neon Circle Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon-grad)" stroke-width="12" filter="url(#glow)" opacity="0.85" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#fff" stroke-width="2" opacity="0.1" />

  <!-- Chronos Clock Hands Vector -->
  <g filter="url(#glow)">
    <!-- Clock Center Pivot -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
    
    <!-- Hour Hand (Pointing to 2 o'clock) -->
    <line x1="256" y1="256" x2="330" y2="210" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    
    <!-- Minute Hand (Pointing to 12 o'clock) -->
    <line x1="256" y1="256" x2="256" y2="130" stroke="url(#neon-grad)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Second Dot indicator (Accent) -->
    <circle cx="256" cy="96" r="8" fill="#06b6d4" />
  </g>
</svg>
